name: publish-to-nuget
on:
  release:
    types: [published] # Fires automatically when your script finishes 'gh release create'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # CRITICAL: Allows GitHub to ask NuGet for a dynamic security token
      contents: read

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Download the .nupkg file that your PowerShell script attached to the release
      - name: Fetch NuGet Asset from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} --pattern "*.nupkg" --dir ./packages --repo ${{ github.repository }}

      # Exchange your GitHub identity token for a temporary NuGet Sandbox API Key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login_sandbox
        with:
          # Put your exact NuGet.org username/profile name here (NOT your email)
          user: CodersRealm 
          # Points the login step to the testing sandbox environment
          #nuget-server-url: https://nugettest.org
          nuget-url: https://nugettest.org

      # Push the binary directly to the target environment using the temporary key
      # Comment this section out once sandbox testing is complete.
      - name: Push to NuGet Sandbox
        run: |
          dotnet nuget push "./packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://nugettest.org/v3/index.json


